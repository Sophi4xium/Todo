<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>タスク管理アプリ</title>
  <style>
    body { font-family: sans-serif; background: #f4f4f4; margin: 0; padding: 0; }
    .container { max-width: 400px; margin: 40px auto; background: #fff; padding: 24px; border-radius: 8px; box-shadow: 0 2px 8px #0001; }
    h1 { text-align: center; }
    form { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
    input[type="text"], input[type="datetime-local"], input[type="number"] { flex: 1; padding: 8px; border: 1px solid #ccc; border-radius: 4px; }
    button { padding: 8px 16px; border: none; background: #1976d2; color: #fff; border-radius: 4px; cursor: pointer; }
    ul { list-style: none; padding: 0; }
    li { display: flex; align-items: center; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #eee; }
    li:last-child { border-bottom: none; }
    .completed { text-decoration: line-through; color: #888; }
    .delete-btn { background: #e53935; margin-left: 8px; }
  </style>
</head>
<body>
  <div class="container">
    <h1>タスク管理</h1>
    <form id="task-form">
      <input type="text" id="task-input" placeholder="新しいタスクを入力" required />
      <input type="datetime-local" id="datetime-input" required />
      <label>重要度:
        <input type="number" id="priority-input" min="1" max="10" value="5" required />
      </label>
      <label>達成難易度:
        <input type="number" id="difficulty-input" min="1" max="10" value="5" required />
      </label>
      <button type="submit">追加</button>
    </form>
    <div id="tasks-by-date"></div>
  </div>
  <script>
    // sort control
    (function(){
      const sortWrap = document.createElement('div');
      sortWrap.style.maxWidth = '400px';
      sortWrap.style.margin = '8px auto';
      sortWrap.style.display = 'flex';
      sortWrap.style.gap = '8px';
      sortWrap.style.alignItems = 'center';
      const label = document.createElement('label');
      label.textContent = '表示順:';
      const sel = document.createElement('select');
      sel.id = 'sort-select';
      ['時間順','優先度順','重要度順'].forEach((t,i) => {
        const o = document.createElement('option'); o.value = i; o.text = t; sel.appendChild(o);
      });
      sortWrap.appendChild(label);
      sortWrap.appendChild(sel);
      document.body.insertBefore(sortWrap, document.querySelector('.container').nextSibling);
    })();
    // --- Web Push helper UI & logic (debug-friendly) ---
    (function(){
      const pushContainer = document.createElement('div');
      pushContainer.style.marginTop = '12px';
      const pushBtn = document.createElement('button');
      pushBtn.id = 'enable-push-btn';
      pushBtn.textContent = 'スマホへプッシュを有効化';
      pushContainer.appendChild(pushBtn);
      // status area for quick debugging on the page
      const status = document.createElement('div');
      status.id = 'push-debug-status';
      status.style.marginTop = '8px';
      status.style.fontSize = '13px';
      status.style.color = '#333';
      pushContainer.appendChild(status);
      document.querySelector('.container').appendChild(pushContainer);

      function setStatus(msg, isError) {
        console.log('[push-debug]', msg);
        status.textContent = msg;
        status.style.color = isError ? '#b00020' : '#0b6623';
      }

      async function urlBase64ToUint8Array(base64String) {
        const padding = '='.repeat((4 - base64String.length % 4) % 4);
        const base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
        const rawData = window.atob(base64);
        const outputArray = new Uint8Array(rawData.length);
        for (let i = 0; i < rawData.length; ++i) {
          outputArray[i] = rawData.charCodeAt(i);
        }
        return outputArray;
      }

      pushBtn.onclick = async () => {
        setStatus('開始: サービスワーカー登録を試行します...');
        if (!('serviceWorker' in navigator) || !('PushManager' in window)) {
          setStatus('このブラウザはServiceWorker または PushManager をサポートしていません。', true);
          alert('このブラウザはPushに対応していません。');
          return;
        }
        try {
          const reg = await navigator.serviceWorker.register('./service-worker.js');
          setStatus('Service Worker 登録成功');
          console.log('Service Worker registered', reg);
          // fetch VAPID public key from server
          setStatus('サーバーから VAPID 公開鍵を取得中...');
          const resp = await fetch('/vapidPublicKey');
          if (!resp.ok) throw new Error('/vapidPublicKey の取得に失敗: ' + resp.status);
          const vapidPublicKey = await resp.text();
          setStatus('VAPID 公開鍵取得成功');
          const applicationServerKey = await urlBase64ToUint8Array(vapidPublicKey.trim());
          setStatus('PushManager.subscribe を呼び出します...');
          const sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey });
          console.log('Subscription', sub);
          setStatus('購読オブジェクトをサーバへ送信中...');
          const r = await fetch('/subscribe', {
            method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(sub)
          });
          if (!r.ok) throw new Error('/subscribe に失敗: ' + r.status);
          setStatus('サブスクライブ成功。サーバへ登録されました。');
          alert('サブスクライブ成功');
        } catch (e) {
          console.error(e);
          setStatus('エラー: ' + (e && e.message ? e.message : e), true);
          alert('サブスクライブに失敗しました: ' + (e && e.message ? e.message : e));
        }
      };
    })();

    // --- DOM references and state (were accidentally removed) ---
    const form = document.getElementById('task-form');
    const input = document.getElementById('task-input');
    const datetimeInput = document.getElementById('datetime-input');
    const priorityInput = document.getElementById('priority-input');
    const difficultyInput = document.getElementById('difficulty-input');
    const tasksByDateDiv = document.getElementById('tasks-by-date');
    let tasks = {}; // { date: [taskObj, ...] }
    const scheduledTimers = {}; // taskId -> timeoutId

    // Notification permission prompt
    if ('Notification' in window) {
      if (Notification.permission === 'default') {
        Notification.requestPermission();
      }
    }

    function sendTaskNotification(task) {
      if ('Notification' in window && Notification.permission === 'granted') {
        const timeStr = `${String(task.hour).padStart(2, '0')}:${String(task.minute).padStart(2, '0')}`;
        new Notification('タスク通知', {
          body: `${timeStr} ${task.text} (重要度:${task.priority}, 難易度:${task.difficulty})`,
        });
      }
    }

    function saveTasksToStorage() {
      try {
        localStorage.setItem('tasks_v1', JSON.stringify(tasks));
      } catch (e) {
        console.error('localStorageに保存できませんでした', e);
      }
    }

    function loadTasksFromStorage() {
      try {
        const raw = localStorage.getItem('tasks_v1');
        if (raw) tasks = JSON.parse(raw) || {};
      } catch (e) {
        console.error('localStorageの読み込みに失敗', e);
        tasks = {};
      }
    }

    function scheduleTaskNotification(date, task) {
      // cancel existing
      cancelScheduledNotification(task.id);
      const when = new Date(`${date}T${String(task.hour).padStart(2,'0')}:${String(task.minute).padStart(2,'0')}:00`).getTime();
      const now = Date.now();
      const delay = when - now;
      // setTimeout の上限は環境依存だが安全のため負でないかを確認
      if (delay > 0 && delay < 2147483647) {
        scheduledTimers[task.id] = setTimeout(() => {
          sendTaskNotification(task);
          // mark notified to avoid duplicate immediate-notify on reload
          task.notified = true;
          saveTasksToStorage();
        }, delay);
      }
    }

    function cancelScheduledNotification(taskId) {
      if (scheduledTimers[taskId]) {
        clearTimeout(scheduledTimers[taskId]);
        delete scheduledTimers[taskId];
      }
    }

    form.addEventListener('submit', function(e) {
      e.preventDefault();
      const text = input.value.trim();
      const datetime = datetimeInput.value;
      const priority = parseInt(priorityInput.value, 10);
      const difficulty = parseInt(difficultyInput.value, 10);
      if (text && datetime && priority && difficulty) {
        // 日付と時刻を分離
        const [date, time] = datetime.split('T');
        const [hour, minute] = time.split(':').map(Number);
        if (!tasks[date]) tasks[date] = [];
        const id = Date.now().toString(36) + Math.random().toString(36).slice(2,8);
        const taskObj = { id, text, priority, difficulty, hour, minute, completed: false };
        tasks[date].push(taskObj);
        // スケジュール
        scheduleTaskNotification(date, taskObj);
        // 即時は追加時通知を出す（任意）
        sendTaskNotification(taskObj);
        saveTasksToStorage();
        input.value = '';
        datetimeInput.value = '';
        priorityInput.value = '5';
        difficultyInput.value = '5';
        renderTasks();
      }
    });

    function renderTasks() {
      // Clear and cancel timers
      tasksByDateDiv.innerHTML = '';
      Object.keys(scheduledTimers).forEach(k => cancelScheduledNotification(k));
      const mode = parseInt((document.getElementById('sort-select') || {value:0}).value, 10);

      // helper to build a list item for a task
      function buildListItem(taskObj, dateKey) {
        const li = document.createElement('li');
        const span = document.createElement('span');
        const timeStr = `${String(taskObj.hour).padStart(2, '0')}:${String(taskObj.minute).padStart(2, '0')}`;
        span.textContent = `${timeStr} ${taskObj.text} [重要度:${taskObj.priority}, 難易度:${taskObj.difficulty}]`;
        if (taskObj.completed) span.classList.add('completed');
        span.addEventListener('click', () => {
          taskObj.completed = !taskObj.completed;
          saveTasksToStorage();
          renderTasks();
        });

        const editBtn = document.createElement('button'); editBtn.textContent='編集'; editBtn.className='edit-btn';
        editBtn.onclick = () => {
          const editForm = document.createElement('form');
          editForm.style.display = 'flex'; editForm.style.gap = '4px';
          const textInput = document.createElement('input'); textInput.type='text'; textInput.value = taskObj.text; textInput.required=true;
          const hourInput = document.createElement('input'); hourInput.type='number'; hourInput.min=0; hourInput.max=23; hourInput.value=taskObj.hour; hourInput.required=true; hourInput.style.width='60px';
          const minuteInput = document.createElement('input'); minuteInput.type='number'; minuteInput.min=0; minuteInput.max=59; minuteInput.value=taskObj.minute; minuteInput.required=true; minuteInput.style.width='60px';
          const priorityInputEl = document.createElement('input'); priorityInputEl.type='number'; priorityInputEl.min=1; priorityInputEl.max=10; priorityInputEl.value=taskObj.priority; priorityInputEl.required=true; priorityInputEl.style.width='60px';
          const difficultyInputEl = document.createElement('input'); difficultyInputEl.type='number'; difficultyInputEl.min=1; difficultyInputEl.max=10; difficultyInputEl.value=taskObj.difficulty; difficultyInputEl.required=true; difficultyInputEl.style.width='60px';
          const saveBtn = document.createElement('button'); saveBtn.type='submit'; saveBtn.textContent='保存';
          const cancelBtn = document.createElement('button'); cancelBtn.type='button'; cancelBtn.textContent='キャンセル'; cancelBtn.onclick = () => renderTasks();
          editForm.appendChild(textInput); editForm.appendChild(hourInput); editForm.appendChild(minuteInput); editForm.appendChild(priorityInputEl); editForm.appendChild(difficultyInputEl); editForm.appendChild(saveBtn); editForm.appendChild(cancelBtn);
          li.innerHTML = ''; li.appendChild(editForm);
          editForm.onsubmit = (e) => {
            e.preventDefault();
            taskObj.text = textInput.value;
            taskObj.hour = parseInt(hourInput.value, 10);
            taskObj.minute = parseInt(minuteInput.value, 10);
            taskObj.priority = parseInt(priorityInputEl.value, 10);
            taskObj.difficulty = parseInt(difficultyInputEl.value, 10);
            saveTasksToStorage();
            scheduleTaskNotification(dateKey, taskObj);
            renderTasks();
          };
        };

        const delBtn = document.createElement('button'); delBtn.textContent='削除'; delBtn.className='delete-btn';
        delBtn.onclick = () => {
          const realIdx = tasks[dateKey].findIndex(t => t.id === taskObj.id);
          if (realIdx !== -1) tasks[dateKey].splice(realIdx, 1);
          cancelScheduledNotification(taskObj.id);
          if (tasks[dateKey].length === 0) delete tasks[dateKey];
          saveTasksToStorage();
          renderTasks();
        };

        li.appendChild(span); li.appendChild(editBtn); li.appendChild(delBtn);
        return li;
      }

      if (mode === 0) {
        // 時間順: grouped by date
        const dates = Object.keys(tasks).sort();
        dates.forEach(dateKey => {
          const section = document.createElement('section');
          const h2 = document.createElement('h2'); h2.textContent = dateKey; section.appendChild(h2);
          const ul = document.createElement('ul');
          tasks[dateKey].slice().sort((a,b) => (a.hour - b.hour) || (a.minute - b.minute)).forEach(taskObj => {
            ul.appendChild(buildListItem(taskObj, dateKey));
            scheduleTaskNotification(dateKey, taskObj);
          });
          section.appendChild(ul); tasksByDateDiv.appendChild(section);
        });
      } else {
        // priority or importance: flatten and sort
        const all = [];
        Object.keys(tasks).forEach(dateKey => tasks[dateKey].forEach(t => all.push(Object.assign({date: dateKey}, t))));
        if (mode === 1) {
          all.sort((a,b) => (b.priority - a.priority) || (a.hour - b.hour) || (a.minute - b.minute));
        } else {
          all.sort((a,b) => (b.difficulty - a.difficulty) || (a.hour - b.hour) || (a.minute - b.minute));
        }
        const section = document.createElement('section'); const h2 = document.createElement('h2'); h2.textContent = '全タスク'; section.appendChild(h2);
        const ul = document.createElement('ul');
        all.forEach(taskObj => {
          ul.appendChild(buildListItem(taskObj, taskObj.date));
        });
        section.appendChild(ul); tasksByDateDiv.appendChild(section);
      }
    }

    // リロード時のチェック: 過去に通知されていないタスクは直ちに通知し、未来タスクは再スケジュール
    function checkOnLoadAndSchedule() {
      const now = Date.now();
      Object.keys(tasks).forEach(date => {
        tasks[date].forEach(task => {
          const when = new Date(`${date}T${String(task.hour).padStart(2,'0')}:${String(task.minute).padStart(2,'0')}:00`).getTime();
          if (!task.notified && when <= now) {
            // 過去または現在の時刻でまだ通知されていない -> 直ちに通知
            sendTaskNotification(task);
            task.notified = true;
          } else if (when > now) {
            // 未来のタスクはスケジュール
            scheduleTaskNotification(date, task);
          }
        });
      });
      saveTasksToStorage();
    }

    // 初期化
    loadTasksFromStorage();
    checkOnLoadAndSchedule();
    renderTasks();

  // attach sort change handler
  const sortSelect = document.getElementById('sort-select');
  if (sortSelect) sortSelect.addEventListener('change', () => renderTasks());

    // 注意: この実装はページが開いている間だけ通知スケジュールが有効です。
    // 永続的に端末へプッシュしたい場合はサーバー側でWeb Push (Push API + Service Worker)
    // やSMS送信サービスを導入する必要があります。
  </script>
</body>
</html>
