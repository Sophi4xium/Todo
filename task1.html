<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Web App Manifest -->
  <link rel="manifest" href="/manifest.json">
  <!-- iOS specific: enable standalone display when added to Home Screen -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="タスク管理">
  <link rel="apple-touch-icon" href="/test.jpg">
  <meta name="theme-color" content="#1976d2">
  <title>タスク管理アプリ</title>
  <style>
    body { font-family: sans-serif; background: #f4f4f4; margin: 0; padding: 0; }
    html, body { width: 100%; }
    .container { box-sizing: border-box; width: calc(100% - 32px); max-width: 1100px; margin: 24px auto; background: #fff; padding: 24px; border-radius: 8px; box-shadow: 0 2px 8px #0001; }
    h1 { text-align: center; }
    form { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
    input[type="text"], input[type="datetime-local"], input[type="number"] { flex: 1; padding: 8px; border: 1px solid #ccc; border-radius: 4px; }
    button { padding: 8px 16px; border: none; background: #1976d2; color: #fff; border-radius: 4px; cursor: pointer; }
    ul { list-style: none; padding: 0; }
    li { display: flex; align-items: center; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #eee; }
    li:last-child { border-bottom: none; }
    .completed { text-decoration: line-through; color: #888; }
    .delete-btn { background: #e53935; margin-left: 8px; }
    /* Task grid styles */
    .task-grid { display: grid; grid-template-columns: 80px 1fr 70px 70px 60px 60px; gap: 8px; align-items: center; }
    .task-grid .time { font-weight: 600; color: #333; white-space: nowrap; }
    .task-grid .text { overflow: visible; white-space: normal; word-break: break-word; }
    .task-grid .meta { font-size: 13px; color: #555; text-align: center; }
    .small-btn { padding: 4px 8px; font-size: 13px; }
    .task-grid.header { background: #fafafa; font-weight: 700; border-bottom: 2px solid #e0e0e0; }
  </style>
  <style>
    /* grid layout for task rows */
    .task-grid{
      display:grid;
      grid-template-columns: 80px minmax(180px, 1fr) 70px 70px 60px 60px;
      gap:8px;
      align-items:center;
      padding:6px 8px;
      border-bottom:1px solid #eee;
    }
    .task-grid .time{font-weight:600;color:#333}
    .task-grid .text{overflow:visible;white-space:normal;word-break:break-word}
    .task-grid .meta{color:#666;text-align:center}
    /* collapse grid on narrow screens so content fits without zooming */
    @media (max-width: 700px) {
      .container { width: calc(100% - 20px); padding: 12px; }
      .task-grid { grid-template-columns: 64px 1fr; grid-auto-rows: auto; gap:6px; }
      .task-grid .meta, .task-grid .small-btn { grid-column: 2; justify-self: start; }
      .task-grid .time { grid-column: 1; }
      .task-grid.header { grid-template-columns: 64px 1fr; }
    }
    /* vertical card layout for each task (more readable) */
    .task-vertical{display:flex;flex-direction:column;gap:6px;padding:10px;border:1px solid #f0f0f0;border-radius:6px;background:#fff}
    .tv-row{display:flex;gap:8px;align-items:center}
    .tv-label{min-width:70px;color:#666;font-size:13px}
    .tv-value{flex:1;color:#222}
    .tv-actions{display:flex;gap:8px;}
    /* compact date header and check button */
    .date-row{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 0}
    .date-row h2{margin:0;font-size:16px}
    .check-btn{padding:6px 10px;font-size:13px;border-radius:6px;background:#1976d2;color:#fff;border:none;cursor:pointer}
    .check-btn.small{padding:4px 8px;font-size:12px}
    .small-btn{padding:4px 8px;font-size:12px}
    .delete-btn{background:#ffdddd;border:1px solid #f99}
  </style>
</head>
<body>
  <div class="container">
    <h1>タスク管理</h1>
    <form id="task-form">
      <input type="text" id="task-input" placeholder="新しいタスクを入力" required />
      <input type="datetime-local" id="datetime-input" required />
        <label>重要度:
          <select id="priority-input" required style="padding:8px;border:1px solid #ccc;border-radius:4px;">
            <option value="">選択</option>
          </select>
        </label>
        <label>達成難易度:
          <select id="difficulty-input" required style="padding:8px;border:1px solid #ccc;border-radius:4px;">
            <option value="">選択</option>
          </select>
        </label>
      <label style="flex-basis:100%;">
        メモ:
        <textarea id="memo-input" placeholder="メモ（任意）" rows="2" style="width:100%;box-sizing:border-box;padding:8px;border:1px solid #ccc;border-radius:4px;"></textarea>
      </label>
      <button type="submit">追加</button>
    </form>
    <div id="tasks-by-date"></div>
  </div>
  <script>
    // base server URL used across modules (make global so chat and other code can use it)
    const serverBase = (location.protocol === 'http:' || location.protocol === 'https:') ? window.location.origin : 'http://localhost:3000';
    // (sort control will be created below the range selector)
    // --- Web Push helper UI & logic (debug-friendly) ---
    (function(){
      const pushContainer = document.createElement('div');
      pushContainer.id = 'notifications';
      pushContainer.style.marginTop = '12px';
      const pushBtn = document.createElement('button');
      pushBtn.id = 'enable-push-btn';
      pushBtn.textContent = 'スマホへプッシュを有効化';
      pushContainer.appendChild(pushBtn);
  const sendAllBtn = document.createElement('button');
  sendAllBtn.id = 'send-all-now-btn';
  sendAllBtn.textContent = '今すぐ全通知を飛ばす';
  sendAllBtn.style.marginLeft = '8px';
  pushContainer.appendChild(sendAllBtn);
      // status area for quick debugging on the page
      const status = document.createElement('div');
      status.id = 'push-debug-status';
      status.style.marginTop = '8px';
      status.style.fontSize = '13px';
      status.style.color = '#333';
      pushContainer.appendChild(status);
      document.querySelector('.container').appendChild(pushContainer);

      // determine server base URL; if page is opened via file://, fall back to localhost:3000
      const serverBase = (location.protocol === 'http:' || location.protocol === 'https:') ? window.location.origin : 'http://localhost:3000';

      function setStatus(msg, isError) {
        console.log('[push-debug]', msg);
        status.textContent = msg;
        status.style.color = isError ? '#b00020' : '#0b6623';
      }

      // If opened via file://, show a prominent hint because fetch() needs http/https origin
      if (location.protocol === 'file:') {
        setStatus('警告: このページは file:// で開かれています。サーバ経由で動作させる必要があります。ブラウザで http://localhost:3000/task1.html を開いてください。', true);
      }

      async function urlBase64ToUint8Array(base64String) {
        const padding = '='.repeat((4 - base64String.length % 4) % 4);
        const base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
        const rawData = window.atob(base64);
        const outputArray = new Uint8Array(rawData.length);
        for (let i = 0; i < rawData.length; ++i) {
          outputArray[i] = rawData.charCodeAt(i);
        }
        return outputArray;
      }

      pushBtn.onclick = async () => {
        setStatus('開始: サービスワーカー登録を試行します...');
        if (!('serviceWorker' in navigator) || !('PushManager' in window)) {
          setStatus('このブラウザはServiceWorker または PushManager をサポートしていません。', true);
          alert('このブラウザはPushに対応していません。');
          return;
        }
        try {
          // Register service worker at root scope so PWA/home-screen mode can use it
          const reg = await navigator.serviceWorker.register('/service-worker.js', { scope: '/' });
          setStatus('Service Worker 登録成功');
          console.log('Service Worker registered', reg);
          // fetch VAPID public key from server
          setStatus('サーバーから VAPID 公開鍵を取得中...');
          const resp = await fetch(serverBase + '/vapidPublicKey');
          if (!resp.ok) throw new Error('/vapidPublicKey の取得に失敗: ' + resp.status);
          const vapidPublicKey = await resp.text();
          setStatus('VAPID 公開鍵取得成功');
          const applicationServerKey = await urlBase64ToUint8Array(vapidPublicKey.trim());
          setStatus('PushManager.subscribe を呼び出します...');
          const sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey });
          console.log('Subscription', sub);
          setStatus('購読オブジェクトをサーバへ送信中...');
          const r = await fetch(serverBase + '/subscribe', {
            method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(sub)
          });
          if (!r.ok) throw new Error('/subscribe に失敗: ' + r.status);
          setStatus('サブスクライブ成功。サーバへ登録されました。');
          alert('サブスクライブ成功');
        } catch (e) {
          console.error(e);
          setStatus('エラー: ' + (e && e.message ? e.message : e), true);
          alert('サブスクライブに失敗しました: ' + (e && e.message ? e.message : e));
        }
      };

      // Send all tasks as notifications now (iterate stored tasks and POST each to server)
      sendAllBtn.onclick = async () => {
        setStatus('全通知送信を開始します...');
        try {
          // tasks may be in-memory or in localStorage
          let allTasks = {};
          try { const raw = localStorage.getItem('tasks_v1'); if (raw) allTasks = JSON.parse(raw) || {}; } catch (e) { allTasks = window.tasks || {}; }
          // flatten
          const payloads = [];
          Object.keys(allTasks).forEach(dateKey => {
            (allTasks[dateKey] || []).forEach(t => {
              payloads.push({ title: 'タスクの時間です', task: Object.assign({}, t, { date: dateKey }), url: `/task1.html?task=${encodeURIComponent(t.id)}` });
            });
          });
          if (payloads.length === 0) {
            setStatus('送信するタスクが見つかりませんでした。');
            return;
          }
          setStatus(`合計 ${payloads.length} 件の通知を送信中...`);
          const results = await Promise.allSettled(payloads.map(p => fetch(serverBase + '/sendNotification', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(p) })));
          const fulfilled = results.filter(r => r.status === 'fulfilled').length;
          const rejected = results.filter(r => r.status === 'rejected').length;
          setStatus(`送信完了: 成功 ${fulfilled} 件, 失敗 ${rejected} 件`);
          alert(`送信完了: 成功 ${fulfilled} 件, 失敗 ${rejected} 件`);
        } catch (e) {
          console.error(e);
          setStatus('全通知送信中にエラーが発生しました: ' + (e && e.message ? e.message : e), true);
          alert('エラー: ' + (e && e.message ? e.message : e));
        }
      };

      // --- Daily reminder scheduler UI ---
      const dailyWrap = document.createElement('div');
      dailyWrap.style.marginTop = '8px';
      dailyWrap.style.display = 'flex';
      dailyWrap.style.flexDirection = 'column';
      dailyWrap.style.alignItems = 'stretch';
      dailyWrap.style.gap = '8px';

      const timeLabel = document.createElement('label');
      timeLabel.textContent = '毎日のチェック時刻:';
      const timeInput = document.createElement('input');
      timeInput.type = 'time';
      timeInput.id = 'daily-reminder-time';
      timeInput.value = localStorage.getItem('dailyReminderTime') || '09:00';

      const windowSelect = document.createElement('select');
      windowSelect.id = 'daily-reminder-window';
      [['24時間', '1440'], ['12時間', '720'], ['3時間', '180'], ['1時間', '60'], ['10分', '10']].forEach(([label, val]) => {
        const o = document.createElement('option'); o.value = val; o.text = label; windowSelect.appendChild(o);
      });
      const savedWindow = localStorage.getItem('dailyReminderWindow');
      if (savedWindow) windowSelect.value = savedWindow;

      const scheduleBtn = document.createElement('button');
      scheduleBtn.id = 'schedule-daily-btn';
      scheduleBtn.textContent = 'スケジュールを保存';

      const sendRemNowBtn = document.createElement('button');
      sendRemNowBtn.id = 'send-reminders-now-btn';
      sendRemNowBtn.textContent = '今すぐ期限内チェックして通知';

  // rangeDays: how many days ahead from the scheduled time to include
  // label with inline select for (1~7で選択)
  const rangeDaysLabel = document.createElement('label');
  rangeDaysLabel.textContent = '日以内の通知を飛ばす';
  const rangeDaysSelect = document.createElement('select');
  rangeDaysSelect.id = 'daily-range-days';
  rangeDaysSelect.style.marginRight = '6px';
  for (let i = 1; i <= 7; i++) { const opt = document.createElement('option'); opt.value = String(i); opt.text = String(i); rangeDaysSelect.appendChild(opt); }
  const savedRange = localStorage.getItem('dailyRangeDays'); if (savedRange) rangeDaysSelect.value = savedRange;

  // Button to send notifications for selected N days
  const rangeSendBtn = document.createElement('button');
  rangeSendBtn.type = 'button';
  rangeSendBtn.id = 'range-send-btn';
  rangeSendBtn.textContent = '送信';



    // arrange into vertical rows for better readability (compact notify-only UI)
    const row1 = document.createElement('div'); row1.style.display='flex'; row1.style.gap='8px'; row1.style.alignItems='center';
    row1.appendChild(timeLabel); row1.appendChild(timeInput); row1.appendChild(windowSelect);
    dailyWrap.appendChild(row1);

    const row2 = document.createElement('div'); row2.style.display='flex'; row2.style.gap='8px'; row2.appendChild(scheduleBtn); row2.appendChild(sendRemNowBtn);
    dailyWrap.appendChild(row2);

    const row3 = document.createElement('div'); row3.style.display='flex'; row3.style.gap='8px'; row3.style.alignItems='center';
    // place select before the label text
    row3.appendChild(rangeDaysSelect); row3.appendChild(rangeDaysLabel); row3.appendChild(rangeSendBtn);
    dailyWrap.appendChild(row3);
      pushContainer.appendChild(dailyWrap);

    // populate priority/difficulty selects in the main form
    try {
      const pr = document.getElementById('priority-input');
      const df = document.getElementById('difficulty-input');
      if (pr && pr.tagName === 'SELECT' && df && df.tagName === 'SELECT') {
        for (let i = 1; i <= 10; i++) {
          const o1 = document.createElement('option'); o1.value = String(i); o1.text = String(i); pr.appendChild(o1);
          const o2 = document.createElement('option'); o2.value = String(i); o2.text = String(i); df.appendChild(o2);
        }
        pr.value = '5'; df.value = '5';
      }
    } catch(e){}

    // --- 表示順 (移動済み): 表示基準と昇順/降順トグル ---
    const sortWrap = document.createElement('div');
    sortWrap.style.display = 'flex';
    sortWrap.style.gap = '8px';
    sortWrap.style.alignItems = 'center';
    sortWrap.style.marginTop = '6px';

    const sortLabel = document.createElement('label'); sortLabel.textContent = '表示順:';
    const sortSelect = document.createElement('select'); sortSelect.id = 'sort-select';
    [['時間順',0], ['重要度順',1], ['難易度順',2]].forEach(([t,v])=>{ const o=document.createElement('option'); o.value=String(v); o.text=t; sortSelect.appendChild(o); });

    const orderLabel = document.createElement('label'); orderLabel.textContent = '並び順:';
    const orderSelect = document.createElement('select'); orderSelect.id = 'sort-order';
    const optDesc = document.createElement('option'); optDesc.value = 'desc'; optDesc.text = '降順';
    const optAsc = document.createElement('option'); optAsc.value = 'asc'; optAsc.text = '昇順';
    orderSelect.appendChild(optDesc); orderSelect.appendChild(optAsc);

    // restore saved order if any
    const savedOrder = localStorage.getItem('sortOrder'); if (savedOrder) orderSelect.value = savedOrder;
    const savedSort = localStorage.getItem('sortSelect'); if (savedSort) sortSelect.value = savedSort;

    sortSelect.onchange = () => { try { localStorage.setItem('sortSelect', sortSelect.value); } catch(e){}; renderTasks(); };
    orderSelect.onchange = () => { try { localStorage.setItem('sortOrder', orderSelect.value); } catch(e){}; renderTasks(); };

    sortWrap.appendChild(sortLabel); sortWrap.appendChild(sortSelect); sortWrap.appendChild(orderLabel); sortWrap.appendChild(orderSelect);
    pushContainer.appendChild(sortWrap);

    // --- 未達成リマインダー設定 ---
    const failureLabel = document.createElement('label');
    failureLabel.style.display = 'flex'; failureLabel.style.alignItems = 'center'; failureLabel.style.gap = '8px';
    const failureCheckbox = document.createElement('input'); failureCheckbox.type = 'checkbox'; failureCheckbox.id = 'failure-reminder-enable';
    failureLabel.appendChild(failureCheckbox);
    const failureText = document.createElement('span'); failureText.textContent = '未達成タスクへの繰り返しリマインダーを有効にする'; failureLabel.appendChild(failureText);
    // restore saved
    try { if (localStorage.getItem('failureReminderEnabled') === '1') { failureCheckbox.checked = true; } } catch(e){}
    pushContainer.appendChild(failureLabel);
      // --- Test controls: select a task and start failure reminders immediately ---
      const failureTestLabel = document.createElement('label');
      failureTestLabel.textContent = 'テスト用タスク:';
      failureTestLabel.style.marginLeft = '8px';
      failureTestLabel.style.fontSize = '13px';
      const failureTestSelect = document.createElement('select');
      failureTestSelect.id = 'failure-test-select';
      failureTestSelect.style.marginLeft = '8px';
      failureTestSelect.style.minWidth = '260px';
      failureTestSelect.title = 'テスト対象のタスクを選択';
      const failureTestBtn = document.createElement('button');
      failureTestBtn.id = 'failure-test-now-btn';
      failureTestBtn.textContent = 'テスト: すぐ開始';
      failureTestBtn.style.marginLeft = '8px';
      pushContainer.appendChild(failureTestLabel);
      pushContainer.appendChild(failureTestSelect);
      pushContainer.appendChild(failureTestBtn);

      function populateFailureTestSelect() {
        try {
          failureTestSelect.innerHTML = '';
          const placeholder = document.createElement('option'); placeholder.value = ''; placeholder.text = 'タスクを選択'; failureTestSelect.appendChild(placeholder);
          // use tasks object if available, otherwise read from localStorage
          let src = tasks;
          try {
            if (!src || Object.keys(src).length === 0) {
              const raw = localStorage.getItem('tasks_v1');
              src = raw ? JSON.parse(raw) : {};
            }
          } catch (e) { src = tasks || {}; }
          let added = 0;
          Object.keys(src || {}).forEach(dateKey => {
            (src[dateKey] || []).forEach(t => {
              const o = document.createElement('option');
              o.value = t.id;
              o.text = `${dateKey} ${String(t.hour).padStart(2,'0')}:${String(t.minute).padStart(2,'0')} ${t.text.length>30? t.text.slice(0,30)+'...':t.text}`;
              failureTestSelect.appendChild(o);
              added++;
            });
          });
          if (added === 0) {
            // no tasks available
            failureTestSelect.innerHTML = '';
            const o = document.createElement('option'); o.value = ''; o.text = 'テスト用のタスクがありません'; failureTestSelect.appendChild(o);
            failureTestSelect.disabled = true;
          } else {
            failureTestSelect.disabled = false;
          }
        } catch (e) { console.error('populateFailureTestSelect error', e); }
      }

      failureTestBtn.onclick = () => {
        const id = failureTestSelect.value;
        if (!id) { alert('テスト用のタスクを選択してください'); return; }
        // start immediately and persist schedule
        try {
          startFailureRemindersForTask(id);
          const raw = localStorage.getItem('failureSchedules_v1') || '{}';
          const obj = JSON.parse(raw);
          obj[id] = { start: Date.now(), created: Date.now(), test: true };
          localStorage.setItem('failureSchedules_v1', JSON.stringify(obj));
          alert('テストリマインダーを開始しました（すぐ開始）');
        } catch (e) { console.error('failure test start failed', e); alert('開始に失敗しました'); }
      };

      // Scheduler state
      let dailyReminderTimer = null;
      // Failure reminders state
      const failureTimers = {}; // taskId -> intervalId
      let failureRandomTimer = null;

      function stopFailureReminders(taskId) {
        try {
          if (failureTimers[taskId]) { clearInterval(failureTimers[taskId]); delete failureTimers[taskId]; }
        } catch(e){}
      }

      function startFailureRemindersForTask(taskId) {
        if (failureTimers[taskId]) return;
        let count = 0; const maxCount = 20; const intervalMs = 5 * 60 * 1000;
        const iv = setInterval(() => {
          count++;
          // send mocked teasing message
          try {
            fetch(serverBase + '/sendNotification', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ title: 'タスク未達成', taskId: taskId, body: 'アハハ！残念だったネェ！', url: '/task1.html' }) }).catch(()=>{});
          } catch(e){}
          if (count >= maxCount) { clearInterval(iv); delete failureTimers[taskId];
            // remove persisted schedule when finished
            try { const raw = localStorage.getItem('failureSchedules_v1') || '{}'; const obj = JSON.parse(raw); if (obj[taskId]) { delete obj[taskId]; localStorage.setItem('failureSchedules_v1', JSON.stringify(obj)); } } catch(e){}
          }
        }, intervalMs);
        failureTimers[taskId] = iv;
      }

      // Schedule a failure reminder sequence for a task: start next day at random 8/13/18
      function scheduleFailureSequence(taskId) {
        try {
          const hours = [8,13,18];
          const pick = hours[Math.floor(Math.random()*hours.length)];
          const now = new Date();
          const candidate = new Date(now.getFullYear(), now.getMonth(), now.getDate()+1, pick, 0, 0, 0);
          const startTs = candidate.getTime();
          // persist schedule
          let obj = {};
          try { obj = JSON.parse(localStorage.getItem('failureSchedules_v1') || '{}'); } catch(e) { obj = {}; }
          obj[taskId] = { start: startTs, created: Date.now() };
          localStorage.setItem('failureSchedules_v1', JSON.stringify(obj));
          // set timeout to start the actual reminders
          const delay = startTs - Date.now();
          if (delay <= 0) {
            // start immediately
            startFailureRemindersForTask(taskId);
          } else {
            setTimeout(() => { startFailureRemindersForTask(taskId); }, delay);
          }
        } catch(e) { console.error('scheduleFailureSequence error', e); }
      }

      // Re-create scheduled failure sequences from localStorage on load
      function loadFailureSchedules() {
        try {
          const raw = localStorage.getItem('failureSchedules_v1') || '{}';
          const obj = JSON.parse(raw);
          Object.keys(obj || {}).forEach(taskId => {
            const entry = obj[taskId];
            if (!entry || !entry.start) return;
            const delay = Number(entry.start) - Date.now();
            if (delay <= 0) {
              // start immediately
              startFailureRemindersForTask(taskId);
            } else {
              setTimeout(() => { startFailureRemindersForTask(taskId); }, delay);
            }
          });
        } catch(e) { console.error('loadFailureSchedules error', e); }
      }

      // Expose failure-schedule helpers globally so other script sections can call them
      try {
        window.loadFailureSchedules = loadFailureSchedules;
        window.startFailureRemindersForTask = startFailureRemindersForTask;
        window.scheduleFailureSequence = scheduleFailureSequence;
        window.stopFailureReminders = stopFailureReminders;
      } catch(e) { /* ignore if not allowed */ }

      function scheduleDailyFailureRandom() {
        try { if (failureRandomTimer) { clearTimeout(failureRandomTimer); failureRandomTimer = null; } } catch(e){}
        if (!failureCheckbox.checked) return;
        const now = new Date(); const hours = [8,13,18];
        const pick = hours[Math.floor(Math.random() * hours.length)];
        let candidate = new Date(now.getFullYear(), now.getMonth(), now.getDate(), pick, 0, 0, 0);
        if (candidate.getTime() <= now.getTime()) candidate.setDate(candidate.getDate() + 1);
        const delay = candidate.getTime() - now.getTime();
        failureRandomTimer = setTimeout(() => {
          // find missed (未達成) tasks whose scheduled time is before the candidate time
          try {
            const raw = localStorage.getItem('tasks_v1'); const all = raw ? JSON.parse(raw) : {};
            Object.keys(all).forEach(dateKey => {
              (all[dateKey] || []).forEach(t => {

      // Send upcoming tasks as push notifications (one notification per task)
      async function notifyUpcomingTasks(days) {
        try {
          const raw = localStorage.getItem('tasks_v1');
          const allTasks = raw ? JSON.parse(raw) : {};
          const now = Date.now();
          const end = now + (days || 7) * 24 * 60 * 60 * 1000;
          const startDate = new Date(now);
          const startDateKey = startDate.getFullYear() + '-' + String(startDate.getMonth()+1).padStart(2,'0') + '-' + String(startDate.getDate()).padStart(2,'0');
          const payloads = [];
          Object.keys(allTasks || {}).forEach(dateKey => {
            (allTasks[dateKey] || []).forEach(t => {
              const when = new Date(`${dateKey}T${String(t.hour).padStart(2,'0')}:${String(t.minute).padStart(2,'0')}:00`).getTime();
              // include tasks on the start date even if their time has passed
              if ((dateKey === startDateKey && when <= end) || (when >= now && when <= end)) {
                payloads.push({ title: '期限が近いタスク', task: Object.assign({}, t, { date: dateKey }), url: `/task1.html?task=${encodeURIComponent(t.id)}` });
              }
            });
          });
          if (payloads.length === 0) { setStatus('通知対象のタスクはありませんでした。'); return; }
          setStatus(`期限内 ${payloads.length} 件のタスクを通知送信中...`);
          const results = await Promise.allSettled(payloads.map(p => fetch(serverBase + '/sendNotification', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(p) })));
          const fulfilled = results.filter(r => r.status === 'fulfilled').length;
          const rejected = results.filter(r => r.status === 'rejected').length;
          setStatus(`通知送信完了: 成功 ${fulfilled} 件, 失敗 ${rejected} 件`);
        } catch (e) { console.error('notifyUpcomingTasks error', e); setStatus('通知送信でエラー', true); }
      }

      // Function that checks tasks and sends notifications for those whose deadline is within selected window (minutes)
      async function sendRemindersNow() {
        try {
          const raw = localStorage.getItem('tasks_v1');
          const allTasks = raw ? JSON.parse(raw) : tasks;
          const windowMinutes = parseInt(localStorage.getItem('dailyReminderWindow') || windowSelect.value || '1440', 10);
          const now = Date.now();
          let payloads = [];
          Object.keys(allTasks || {}).forEach(dateKey => {
            (allTasks[dateKey] || []).forEach(t => {
              const when = new Date(`${dateKey}T${String(t.hour).padStart(2,'0')}:${String(t.minute).padStart(2,'0')}:00`).getTime();
              const delta = when - now;
              if (delta > 0 && delta <= windowMinutes * 60 * 1000) {
                // Avoid repeated reminders for same window by marking lastRemindedWindow on task
                t._lastRemindedWindow = t._lastRemindedWindow || {};
                if (t._lastRemindedWindow[windowMinutes]) return; // already reminded for this window
                payloads.push({ title: '期限が近いタスクがあります', task: Object.assign({}, t, { date: dateKey }), url: `/task1.html?task=${encodeURIComponent(t.id)}`, meta: { minutesUntil: Math.round(delta / 60000) } });
                t._lastRemindedWindow[windowMinutes] = Date.now();
              }
            });
          });
          // persist any _lastRemindedWindow changes
          try { localStorage.setItem('tasks_v1', JSON.stringify(allTasks)); } catch (e) { console.error('failed to persist lastRemindedWindow', e); }
          if (payloads.length === 0) { setStatus('期限内のタスクは見つかりませんでした。'); return; }
          setStatus(`期限内 ${payloads.length} 件のタスクに対して通知を送信中...`);
          const results = await Promise.allSettled(payloads.map(p => fetch(serverBase + '/sendNotification', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(p) })));
          const fulfilled = results.filter(r => r.status === 'fulfilled').length;
          const rejected = results.filter(r => r.status === 'rejected').length;
          setStatus(`期限チェック送信完了: 成功 ${fulfilled} 件, 失敗 ${rejected} 件`);
        } catch (e) {
          console.error(e);
          setStatus('期限チェック中にエラーが発生しました: ' + (e && e.message ? e.message : e), true);
        }
      }

    // Record a task action (done/failed) and persist history; reusable from URL handler and in-page prompt
    function recordTaskAction(taskId, action) {
      try {
        let found = null; let foundDate = null;
        Object.keys(tasks).forEach(dk => { (tasks[dk] || []).forEach(t => { if (t.id === taskId) { found = t; foundDate = dk; } }); });
        if (!found) return false;
        const histKey = 'task_status_history_v1';
        const now = new Date();
        const entry = { taskId, date: now.toISOString(), action: action === 'mark_done' ? 'done' : (action === 'mark_failed' ? 'failed' : action), taskText: found.text };
        try { const raw = localStorage.getItem(histKey) || '[]'; const arr = JSON.parse(raw); arr.push(entry); localStorage.setItem(histKey, JSON.stringify(arr)); } catch(e) { console.error('failed to persist task history', e); }
        if (action === 'mark_done') {
          found.completed = true;
          try { stopFailureReminders(taskId); const raw = localStorage.getItem('failureSchedules_v1') || '{}'; const obj = JSON.parse(raw); if (obj[taskId]) { delete obj[taskId]; localStorage.setItem('failureSchedules_v1', JSON.stringify(obj)); } } catch(e){}
        }
        if (action === 'mark_failed') {
          scheduleFailureSequence(taskId);
        }
        saveTasksToStorage(); renderTasks();
        try { appendMessage && appendMessage('bot', `タスク「${found.text}」を「${entry.action}」として記録しました (${now.toLocaleString()})`); pushHistory && pushHistory('bot', `記録: ${entry.action}`); } catch(e){}
        return true;

    }

    function scheduleTaskNotification(date, task) {
      // cancel existing
      cancelScheduledNotification(task.id);
      const when = new Date(`${date}T${String(task.hour).padStart(2,'0')}:${String(task.minute).padStart(2,'0')}:00`).getTime();
      const now = Date.now();
      const delay = when - now;
      // setTimeout の上限は環境依存だが安全のため負でないかを確認
      if (delay > 0 && delay < 2147483647) {
        scheduledTimers[task.id] = setTimeout(() => {
          // ローカル通知
          sendTaskNotification(task);
          
          // サーバーへプッシュ通知リクエストを送信
          // Send actionable notification so user can mark done/failed
          try {
            const payload = {
              title: '期限到来: タスクの確認',

    // リロード時のチェック: 過去に通知されていないタスクは直ちに通知し、未来タスクは再スケジュール
    function checkOnLoadAndSchedule() {
      const now = Date.now();
      Object.keys(tasks).forEach(date => {
        tasks[date].forEach(task => {
          const when = new Date(`${date}T${String(task.hour).padStart(2,'0')}:${String(task.minute).padStart(2,'0')}:00`).getTime();
          if (!task.notified && when <= now) {
            // 過去または現在の時刻でまだ通知されていない -> 直ちに通知
            // show local notification and send actionable push so user can mark result
            sendTaskNotification(task);
            try {
              const payload = {
                title: '期限到来: タスクの確認',
                body: `期限を過ぎました: ${task.text}。達成できましたか？`,
                task: Object.assign({}, task, { date }),
                url: `/task1.html`,
                actions: [ { action: 'mark_done', title: '達成' }, { action: 'mark_failed', title: '未達成' } ],
                type: 'deadline_check'
              };
              fetch('/sendNotification', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(payload) }).catch(()=>{});
            } catch(e) { console.error('failed to send immediate push', e); }
            task.notified = true;
          } else if (when > now) {
            // 未来のタスクはスケジュール
            scheduleTaskNotification(date, task);
          }
        });
      });
      saveTasksToStorage();
    }

    // Check URL params to handle notification action clicks from service-worker
    (function handleNotificationActionParams(){
      try {
        const params = new URLSearchParams(location.search);
        // If a direct action param is present (from notification action buttons), record it
        if (params.has('taskAction')) {
          const action = params.get('taskAction');
          const taskId = params.get('taskId');
          if (taskId) {
            const ok = recordTaskAction(taskId, action);
            if (!ok) appendMessage && appendMessage('bot', '該当タスクが見つかりませんでした。');
          }
          history.replaceState(null, '', location.pathname);
          return;
        }
        // Fallback: if opened via notification tap on platforms without action buttons,
        // show the in-page prompt to let the user choose.
        if (params.get('openAction') === 'prompt' && params.has('taskId')) {
          const taskId = params.get('taskId');
          let found = null;
          Object.keys(tasks).forEach(dk => { (tasks[dk] || []).forEach(t => { if (t.id === taskId) found = t; }); });
          if (found) {
            try { showInPageActionPrompt(found); } catch(e) { console.error('failed to show in-page prompt', e); }
          } else {
            appendMessage && appendMessage('bot', '該当タスクが見つかりませんでした。');
          }
          history.replaceState(null, '', location.pathname);
        }
      } catch(e) { console.error('handleNotificationActionParams error', e); }
    })();
    // Render tasks only when requested via #showTasks (keeps main app open state empty)

      // Additionally, if there are saved tasks in localStorage, render them automatically
      // so users don't need to add a task to see existing data.
      if (location.hash === '#showTasks' || (tasks && Object.keys(tasks).length > 0)) {
        renderTasks();
      } else {
        // clear the view when not showing and no tasks exist
        tasksByDateDiv.innerHTML = '';
      }
    }
    ensureRenderByHash();
    window.addEventListener('hashchange', ensureRenderByHash);

    // If the app was opened without params but a recent notification exists, show prompt
    async function checkRecentNotificationsOnOpen() {
      try {
        const resp = await fetch('/recentNotifications');
        if (!resp.ok) return;
        const j = await resp.json();
        const arr = j && j.recent ? j.recent : [];
        if (!arr || arr.length === 0) return;
        // Find the most recent notification with a task id
        const recentWithTask = arr.slice().reverse().find(x => x.task && x.task.id);
        if (!recentWithTask) return;
        const taskId = recentWithTask.task.id;
        // avoid showing repeatedly by tracking lastShown timestamp per task
        const seenKey = `seenRecentNotif_${taskId}`;
        if (localStorage.getItem(seenKey)) return;
        // find task locally
        let found = null;
        Object.keys(tasks).forEach(dk => { (tasks[dk] || []).forEach(t => { if (t.id === taskId) found = t; }); });
        if (found) {
          showInPageActionPrompt(found);
          localStorage.setItem(seenKey, String(Date.now()));
        }
      } catch(e) { console.error('checkRecentNotificationsOnOpen error', e); }
    }

    // Manual UI: fetch recent notifications and show a modal so user can trigger prompts
    async function fetchRecentNotifications() {
      try {
        const resp = await fetch('/recentNotifications');
        if (!resp.ok) { setStatus && setStatus('recentNotifications の取得に失敗'); return; }
        const j = await resp.json();
        const arr = j && j.recent ? j.recent : [];
        showRecentNotificationsModal(arr);
      } catch(e) { console.error('fetchRecentNotifications error', e); setStatus && setStatus('recentNotifications の取得でエラー'); }
    }

    function showRecentNotificationsModal(arr) {
      try {
        const existing = document.getElementById('recent-notif-modal'); if (existing) existing.remove();
        const wrap = document.createElement('div'); wrap.id='recent-notif-modal';
        wrap.style.position='fixed'; wrap.style.left='8px'; wrap.style.right='8px'; wrap.style.top='80px'; wrap.style.maxHeight='60%'; wrap.style.overflow='auto'; wrap.style.background='#fff'; wrap.style.border='1px solid #ccc'; wrap.style.padding='12px'; wrap.style.zIndex=10000; wrap.style.borderRadius='8px';
        const h = document.createElement('div'); h.textContent='最近の通知'; h.style.fontWeight='600'; h.style.marginBottom='8px'; wrap.appendChild(h);
        if (!arr || arr.length === 0) {
          const p = document.createElement('div'); p.textContent='最近の通知はありません'; wrap.appendChild(p);
        } else {
          arr.forEach(item => {
            const row = document.createElement('div'); row.style.borderBottom='1px solid #eee'; row.style.padding='8px 0';
            const t = document.createElement('div'); t.textContent = (item.title || '') + (item.task && item.task.text ? (' — ' + item.task.text) : ''); row.appendChild(t);
            const btn = document.createElement('button'); btn.textContent='プロンプト表示'; btn.className='small-btn'; btn.style.marginTop='6px';
            btn.onclick = () => {
              try {
                if (item.task && item.task.id) {
                  let found = null;
                  Object.keys(tasks).forEach(dk => { (tasks[dk] || []).forEach(tt => { if (tt.id === item.task.id) found = tt; }); });
                  if (found) { showInPageActionPrompt(found); } else { alert('該当タスクが見つかりません。'); }
                }
              } catch(e) { console.error(e); }
            };
            row.appendChild(btn);
            wrap.appendChild(row);
          });
        }
        const close = document.createElement('button'); close.textContent='閉じる'; close.className='small-btn'; close.style.marginTop='8px'; close.onclick = () => { wrap.remove(); };
        wrap.appendChild(close);
        document.body.appendChild(wrap);
      } catch(e) { console.error('showRecentNotificationsModal error', e); }
    }

    // Add floating button to open recent notifications
    try {
      const recentBtn = document.createElement('button');
      recentBtn.id='recent-notif-btn';
      recentBtn.textContent='最近の通知';
      recentBtn.style.position='fixed'; recentBtn.style.right='12px'; recentBtn.style.top='12px'; recentBtn.style.zIndex=10000; recentBtn.style.padding='8px 10px'; recentBtn.style.borderRadius='8px'; recentBtn.style.background='#007bff'; recentBtn.style.color='#fff'; recentBtn.style.border='none';
      recentBtn.onclick = fetchRecentNotifications;
      document.body.appendChild(recentBtn);
    } catch(e) { /* ignore */ }

  // attach sort change handler
  const sortSelect = document.getElementById('sort-select');
  if (sortSelect) sortSelect.addEventListener('change', () => renderTasks());

    // 注意: この実装はページが開いている間だけ通知スケジュールが有効です。
    // 永続的に端末へプッシュしたい場合はサーバー側でWeb Push (Push API + Service Worker)
    // やSMS送信サービスを導入する必要があります。
  </script>
</body>
</html>
